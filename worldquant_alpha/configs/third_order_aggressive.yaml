# 三阶Alpha生成Pipeline - 激进配置
# 更低的筛选阈值，更多的Alpha通过，适合快速探索
pipeline:
  name: "三阶Alpha生成Pipeline - 激进模式"
  version: "2.0"

  settings:
    region: "USA"
    universe: "TOP3000"
    instrument_type: "EQUITY"
    delay: 1

  data:
    datasets: ["fundamental6", "mdl110", "anl14"]
    preprocessing:
      backfill_days: 120
      winsorize_std: 4

  stages:
    first_order:
      enabled: true
      operations:
        - ts_rank
        - ts_zscore
        - ts_mean
        - ts_std_dev
        - ts_delta
        - ts_sum
        - ts_delay
        - ts_arg_min
        - ts_arg_max
        - ts_scale
        - ts_quantile
        - ts_corr
        - ts_cov
      time_windows: [5, 10, 22, 66, 120, 240]
      decay_range: [0, 4, 8, 12, 16]

    first_order_filter:
      sharpe_threshold: 0.5
      fitness_threshold: 0.3
      prune_keep_per_field: 5

    second_order:
      enabled: true
      group_operations:
        - group_rank
        - group_neutralize
        - group_zscore
        - group_scale
        - group_mean
        - group_normalize
      regions: ["USA"]

    second_order_filter:
      sharpe_threshold: 0.7
      fitness_threshold: 0.5
      prune_keep_per_field: 3

    third_order:
      enabled: true
      entry_events:
        volume_breakout: true
        price_volume_divergence: true
        volatility_breakout: true
        momentum_breakout: true
      exit_events:
        profit_target: 0.08
        stop_loss: -0.08
        holding_period: -1

    third_order_filter:
      sharpe_threshold: 1.0
      fitness_threshold: 0.8
      prune_keep_per_field: 2

  backtest:
    mode: "concurrent"
    max_workers: 6
    batch_size: 15
    neutrals: ["SUBINDUSTRY", "INDUSTRY", "MARKET"]
    settings:
      truncation: 0.08
      pasteurization: "ON"
      test_period: "P0Y"
      decay: 0

  output:
    save_intermediate: true
    export_csv: true
    email_notification: false
