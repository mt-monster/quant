# 三阶Alpha生成Pipeline - 保守配置
# 更高的筛选阈值，只保留高质量的Alpha，适合稳健策略
pipeline:
  name: "三阶Alpha生成Pipeline - 保守模式"
  version: "2.0"

  settings:
    region: "USA"
    universe: "TOP3000"
    instrument_type: "EQUITY"
    delay: 1

  data:
    datasets: ["fundamental6", "mdl110"]
    preprocessing:
      backfill_days: 120
      winsorize_std: 4

  stages:
    first_order:
      enabled: true
      operations:
        - ts_rank
        - ts_zscore
        - ts_mean
        - ts_std_dev
      time_windows: [22, 66, 120]
      decay_range: [0, 12]

    first_order_filter:
      sharpe_threshold: 1.0
      fitness_threshold: 0.7
      prune_keep_per_field: 2

    second_order:
      enabled: true
      group_operations:
        - group_rank
        - group_neutralize
        - group_zscore
      regions: ["USA"]

    second_order_filter:
      sharpe_threshold: 1.25
      fitness_threshold: 1.0
      prune_keep_per_field: 1

    third_order:
      enabled: true
      entry_events:
        volume_breakout: true
        price_volume_divergence: false
        volatility_breakout: true
      exit_events:
        profit_target: 0.15
        stop_loss: -0.03
        holding_period: 20

    third_order_filter:
      sharpe_threshold: 1.5
      fitness_threshold: 1.25
      prune_keep_per_field: 1

  backtest:
    mode: "sequential"  # 保守模式使用顺序执行，确保稳定性
    max_workers: 2
    batch_size: 5
    neutrals: ["SUBINDUSTRY", "INDUSTRY", "MARKET"]
    settings:
      truncation: 0.08
      pasteurization: "ON"
      test_period: "P0Y"
      decay: 0

  output:
    save_intermediate: true
    export_csv: true
    email_notification: false
